<style>
:root{
    --ink:#122238;
    --ink-soft:#5b6b82;
    --paper:#eef2f6;
    --card:#ffffff;
    --line:#dfe6ee;
    --navy:#1c3a5e;
    --navy-deep:#0f2743;
    --teal:#1f9d8b;
    --teal-soft:#e4f5f1;
    --amber:#e3922b;
    --amber-soft:#fbf0df;
    --coral:#d85c4a;
    --coral-soft:#fbe8e4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Be Vietnam Pro', sans-serif;
    background:
      radial-gradient(circle at 15% 8%, #e9eff5 0%, transparent 45%),
      var(--paper);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:36px 16px;
  }

  .device{
    width:390px;
    max-width:100%;
    background:var(--card);
    border-radius:34px;
    box-shadow:0 24px 60px -18px rgba(15,39,67,0.35), 0 2px 8px rgba(15,39,67,0.08);
    overflow:hidden;
    border:8px solid var(--navy-deep);
    position:relative;
  }
  .notch{
    position:absolute;
    top:8px; left:50%; transform:translateX(-50%);
    width:120px; height:20px;
    background:var(--navy-deep);
    border-radius:0 0 14px 14px;
    z-index:20;
  }

  /* status bar */
  .statusbar{
    background:var(--navy-deep);
    color:#cdd9e5;
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:14px 22px 6px;
    display:flex;
    justify-content:space-between;
    letter-spacing:.02em;
  }

  /* top header + filter selects */
  .tabbar{
    background:var(--paper);
    padding:calc(max(14px, env(safe-area-inset-top)) + 63px) 0 0;
  }
  .tabbar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:max(14px, env(safe-area-inset-top)) 14px 13px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 40%),
      var(--navy-deep);
    box-shadow:0 6px 16px -10px rgba(5,15,28,0.35);
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:50;
  }
  .tabbar-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#eef4fb;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tabbar-title::before{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 4px rgba(31,157,139,0.22);
    flex:0 0 auto;
  }
  .camera-icon-btn{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:10px;
    background:var(--navy);
    border:1px solid rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .camera-icon-btn svg{width:17px;height:17px;stroke:#fff;}
  .camera-icon-btn .live-dot{
    position:absolute;
    top:-3px;right:-3px;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--coral);
    border:2px solid var(--navy-deep);
  }

  .filter-stack{
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:0 16px 12px;
  }
  .select-wrap{
    position:relative;
    display:flex;
    align-items:center;
    border-radius:13px;
    transition:transform .12s ease;
  }
  .select-wrap:focus-within{transform:translateY(-1px);}
  .select-icon{
    position:absolute;
    left:12px;
    width:15px;height:15px;
    stroke:var(--navy);
    pointer-events:none;
  }
  .filter-select{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:13px;
    padding:11px 32px 11px 36px;
    font-family:'Be Vietnam Pro', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    box-shadow:0 6px 14px -10px rgba(15,39,67,0.18);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .filter-select:focus{
    outline:none;
    border-color:#9fb0c2;
    box-shadow:0 0 0 3px rgba(15,39,67,0.1);
  }
  .select-chevron{
    position:absolute;
    right:12px;
    width:13px;height:13px;
    stroke:var(--navy);
    pointer-events:none;
  }

  /* Danh sách chọn riêng: áp dụng ngay, không dùng Next/H.tất của điện thoại. */
  .class-native-select{
    position:absolute !important;
    width:1px !important;height:1px !important;
    opacity:0 !important;pointer-events:none !important;
    overflow:hidden !important;
  }
  .class-picker-trigger{
    display:block;text-align:left;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .class-picker-trigger:disabled{opacity:.58;cursor:default;}
  .select-wrap .class-picker-trigger{padding-right:32px;}
  #classPickerOverlay{
    align-items:center;
    padding:12px 16px max(16px, env(safe-area-inset-bottom));
    padding-top:max(16px, env(safe-area-inset-top));
  }
  .class-picker-sheet{
    width:min(100%,520px);
    height:min(88vh,720px);
    height:min(88dvh,720px);
    max-height:calc(100vh - 28px);
    max-height:calc(100dvh - 28px);
    display:flex;flex-direction:column;gap:10px;
  }
  .class-picker-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .class-picker-top .message-sheet-title{margin:0;text-align:left;}
  .class-picker-close{
    flex:0 0 auto;width:38px;height:38px;border:0;border-radius:50%;
    background:#e8eef5;color:var(--navy);font-size:25px;line-height:1;
  }
  .class-picker-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px 2px 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .class-picker-option{
    width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;padding:10px 14px;
    background:var(--paper);color:var(--ink);text-align:center;
    font:700 13px 'Be Vietnam Pro',sans-serif;
    line-height:1.35;white-space:normal;overflow-wrap:anywhere;
  }
  .class-picker-option.current{background:var(--teal-soft);border-color:var(--teal);color:#0c6b5c;}
  .class-picker-list[data-picker-for="teacherSelect"] .class-picker-option,
  .class-picker-list[data-picker-for="subjectSelect"] .class-picker-option{text-align:left;}
  .class-picker-empty{padding:18px;text-align:center;color:var(--ink-soft);font-size:12px;}

  .screen{
    background:var(--paper);
    padding:16px 16px calc(70px + max(16px, env(safe-area-inset-bottom)));
  }

  /* eyebrow */
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 2px 8px;
  }

  /* student card */
  .student-card{
    background:var(--card);
    border-radius:20px;
    border:1px solid var(--line);
    padding:16px;
    display:flex;
    gap:14px;
    align-items:center;
    box-shadow:0 10px 24px -16px rgba(15,39,67,0.25);
    position:relative;
  }
  .student-meta{min-width:0;}
  .quick-student-list-btn{
    position:absolute;right:13px;bottom:13px;display:flex;align-items:center;gap:5px;
    border:1px solid #cbd8e5;border-radius:10px;padding:7px 8px;background:#f3f7fb;
    color:var(--navy);font:700 9.5px 'Be Vietnam Pro',sans-serif;white-space:nowrap;
  }
  .quick-student-list-btn svg{width:13px;height:13px;stroke:currentColor;}
  .quick-student-list-btn:disabled{opacity:.38;pointer-events:none;}
  .avatar{
    width:84px;height:84px;border-radius:18px;
    background:linear-gradient(150deg,#2c4d76,#173350);
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    overflow:hidden;
    color:#cfe0f0;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
  }
  .avatar img{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
    display:none;
  }
  .avatar.has-photo img{display:block;}
  .avatar.has-photo .avatar-initials{visibility:hidden;}
  .avatar.has-photo{cursor:zoom-in;box-shadow:0 0 0 2px rgba(31,157,139,.18);}
  .avatar:focus-visible{outline:3px solid rgba(31,157,139,.35);outline-offset:3px;}

  .photo-viewer-overlay{
    position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(5,14,25,.92);
  }
  .photo-viewer-overlay.show{display:flex;}
  .photo-viewer-dialog{
    width:min(100%,720px);max-height:calc(100vh - 36px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative;
  }
  .photo-viewer-image{
    display:block;max-width:100%;max-height:calc(100vh - 115px);border-radius:16px;
    object-fit:contain;background:#0f1d2c;box-shadow:0 18px 55px rgba(0,0,0,.45);
    touch-action:pinch-zoom;
  }
  .photo-viewer-name{margin-top:13px;color:#fff;font-size:16px;font-weight:800;text-align:center;}
  .photo-viewer-close{
    position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;
    border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(15,39,67,.78);
    color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  body.photo-viewer-open{overflow:hidden;}
  #studentJumpOverlay{
    align-items:flex-start;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
  }
  .student-jump-sheet{
    height:calc(100vh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    height:calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height:none;display:flex;flex-direction:column;
  }
  .student-jump-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .student-jump-top .message-sheet-title{margin:0;text-align:left;}
  .student-jump-close{
    width:34px;height:34px;border:0;border-radius:50%;background:#e8eef5;color:var(--navy);
    font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .student-jump-search{
    width:100%;margin:12px 0 10px;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;background:#f7f9fb;color:var(--ink);
    /* iPhone/Safari tự phóng to trang nếu ô nhập có chữ nhỏ hơn 16px. */
    font:600 16px 'Be Vietnam Pro',sans-serif;
  }
  .student-jump-search:focus{outline:none;border-color:#9fb0c2;box-shadow:0 0 0 3px rgba(15,39,67,.09);}
  .student-jump-list{
    flex:1;display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;
    padding-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .student-jump-row{
    width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;
    align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;
    background:#f7f9fb;text-align:left;color:var(--ink);
  }
  .student-jump-row.current{border-color:var(--teal);background:var(--teal-soft);}
  .student-jump-stt{font:700 11px 'Space Grotesk',sans-serif;color:var(--navy);}
  .student-jump-name{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .student-jump-status{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:800 15px/1 'Space Grotesk',sans-serif;color:var(--ink-soft);background:#e8eef5;}
  .student-jump-status.present{background:#dff4ec;color:#087a54;}
  .student-jump-status.absent{background:#fde7e4;color:#bc3d32;}
  .student-jump-status.excused{background:#fff0d6;color:#b66c0c;font-size:13px;}
  .student-jump-status.unknown{font-size:16px;}
  .student-jump-empty{padding:24px 10px;text-align:center;color:var(--ink-soft);font-size:12px;}
  .student-meta h2{
    margin:0 0 2px;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .student-meta p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .student-meta .id-pill{
    display:inline-block;
    margin-top:6px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--navy);
    background:#e3ebf3;
    padding:3px 9px;
    border-radius:999px;
  }

  /* attendance status buttons */
  .status-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-top:14px;
  }
  .status-btn{
    border-radius:14px;
    padding:12px 6px 10px;
    text-align:center;
    font-weight:700;
    font-size:12.5px;
    border:1.5px solid transparent;
    position:relative;
  }
  .status-btn .dot{
    width:7px;height:7px;border-radius:50%;
    display:inline-block;margin-right:5px;
  }
  .status-btn.present{
    background:var(--teal-soft);
    color:#0c6b5c;
    border-color:#bfe6dd;
  }
  .status-btn.present .dot{background:var(--teal);}
  .status-btn.absent{
    background:var(--coral-soft);
    color:#a13f2f;
    border-color:#f2c8bf;
  }
  .status-btn.absent .dot{background:var(--coral);}
  .status-btn.excused{
    background:var(--amber-soft);
    color:#93630f;
    border-color:#f0d9ab;
  }
  .status-btn.excused .dot{background:var(--amber);}
  .status-btn.selected{
    box-shadow:0 6px 14px -6px rgba(15,39,67,0.3);
    transform:translateY(-1px);
  }
  .status-btn.selected::after{
    content:"✓ đã chọn";
    display:block;
    font-size:9px;
    font-weight:600;
    letter-spacing:.03em;
    opacity:.75;
    margin-top:2px;
  }

  /* contact groups (Học sinh / Cha / Mẹ) */
  .contact-groups{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:14px;
  }
  .contact-group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    box-shadow:0 8px 18px -14px rgba(15,39,67,0.2);
  }
  .contact-group-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding:0 2px;
  }
  .contact-group-head .avatar-sm{
    width:24px;height:24px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:10px;font-weight:700;color:#fff;
    flex:0 0 auto;
  }
  .contact-group.student .avatar-sm{background:linear-gradient(150deg,#2c4d76,#173350);}
  .contact-group.father .avatar-sm{background:linear-gradient(150deg,#1f9d8b,#0c6b5c);}
  .contact-group.mother .avatar-sm{background:linear-gradient(150deg,#d8879a,#a1436a);}
  .contact-group-head .who{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
  }
  .contact-group-head .who span{
    display:block;
    font-size:10.5px;
    font-weight:500;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .contact-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
  }
  .contact-btn{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px 6px;
    text-align:center;
    font-size:11.5px;
    font-weight:600;
    color:var(--navy);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .contact-btn svg{width:16px;height:16px;stroke:var(--navy);}
  .contact-btn.zalo svg{stroke:#1a7fd1;}
  .contact-btn.zalo{color:#1a7fd1;}

  /* stats card */
  .section{
    background:var(--card);
    border-radius:18px;
    border:1px solid var(--line);
    margin-top:16px;
    overflow:hidden;
  }
  .section-head{
    padding:12px 16px;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-head .cap{
    font-size:10px;
    color:var(--ink-soft);
    font-weight:600;
    background:#eef2f6;
    padding:3px 8px;
    border-radius:999px;
  }
  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  .stat{
    padding:14px 16px;
    text-align:center;
  }
  .stat:first-child{border-right:1px solid var(--line);}
  .stat .num{
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:700;
    color:var(--navy);
    line-height:1;
  }
  .stat.excused .num{color:#93630f;}
  .stat.absent .num{color:#a13f2f;}
  .stat .lbl{
    margin-top:5px;
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:600;
    line-height:1.3;
  }

  /* camera attendance CTA */
  .camera-cta{
    margin-top:16px;
    background:linear-gradient(135deg,var(--navy),var(--navy-deep));
    border-radius:18px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
  }
  .camera-cta .icon-wrap{
    width:38px;height:38px;border-radius:11px;
    background:rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .camera-cta .icon-wrap svg{width:19px;height:19px;stroke:#fff;}
  .camera-cta .txt{flex:1;}
  .camera-cta .txt .t1{font-size:13px;font-weight:700;}
  .camera-cta .txt .t2{font-size:10.5px;color:#c3d3e3;font-weight:500;margin-top:1px;}
  .camera-cta .arrow{color:#c3d3e3;font-size:16px;}

  /* profile info */
  .profile-body{padding:14px 16px 16px;}
  .info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:12.5px;
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--ink-soft);font-weight:500;}
  .info-row .v{color:var(--ink);font-weight:600;text-align:right;max-width:68%;overflow-wrap:anywhere;}
  .profile-note-row{align-items:flex-start;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .profile-note-row:active{opacity:.68;}
  .profile-note-row .v{
    flex:1;max-width:none;white-space:pre-wrap;min-height:18px;
    text-align:justify;text-align-last:left;text-justify:inter-word;
  }
  .profile-note-edit{
    flex:0 0 auto;width:18px;height:18px;margin-top:1px;stroke:var(--teal);stroke-width:2;
  }
  .profile-note-row:focus-visible{outline:3px solid rgba(31,157,139,.22);outline-offset:3px;border-radius:8px;}


  /* =====================================================
     APP PAGES / BOTTOM NAVIGATION
     Chỉ trang Điểm danh đang hoạt động.
     4 trang còn lại để trống để bổ sung sau.
     ===================================================== */
  .app-page{
    display:none;
    min-height:100dvh;
  }

  .app-page.active-page{
    display:block;
  }

  .app-page.blank-page{
    min-height:100dvh;
    background:var(--card);
  }

  .navitem{
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .navitem:active{
    opacity:.72;
  }

  /* bottom nav */
  .bottomnav{
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:10px 6px max(16px, env(safe-area-inset-bottom));
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    box-shadow:0 -6px 16px -10px rgba(5,15,28,0.25);
  }
  .navitem{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:10px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .navitem svg{width:20px;height:20px;stroke:var(--ink-soft);}
  .navitem.active{color:var(--navy);}
  .navitem.active svg{stroke:var(--navy);}
  .navitem.active .ring{
    width:4px;height:4px;border-radius:50%;background:var(--teal);
  }

  /* session toggle: Sang / Chieu */
  .session-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
