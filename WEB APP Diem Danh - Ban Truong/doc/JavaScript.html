<script>
/*
 * KHỐI 2: dữ liệu và chức năng chính của giao diện.
 * google.script.run là cầu nối từ Index.html sang các hàm trong Code.gs.
 */
let students = [];
let currentStudentIndex = 0;
let currentClassName = '';
let loadingRequest = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let pointerTracking = false;
// localStorage chỉ tồn tại trên đúng trình duyệt của thiết bị đang sử dụng.
// Vì vậy lựa chọn trên điện thoại GV1 không ảnh hưởng điện thoại GV2, GV3...
const STORAGE_DEFAULT_TEACHER = 'attendance_default_teacher';
const STORAGE_DEFAULT_CLASS = 'attendance_default_class';
const STORAGE_SUBJECT_PREFIX = 'attendance_default_subject_';
const STORAGE_TEACHERS_PREFIX = 'attendance_teachers_cache_';
const STORAGE_CLASSES = 'attendance_classes_cache';

let subjectDetails = [];
let currentSubjects = [];
const adjacentPhotoCache = new Map();
const MAX_PRELOADED_PHOTOS = 6;
const profilePhotoDataCache = new Map();
const MAX_PROFILE_PHOTO_DATA_CACHE = 12;
const profilePhotoProxyPending = new Set();
let profilePhotoProxyMode = false;
let profilePhotoPreloadGeneration = 0;
const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
const FACE_CAPTURE_GUIDES = [
  'Nhìn thẳng vào camera',
  'Quay mặt nhẹ sang trái',
  'Quay mặt nhẹ sang phải',
  'Ngẩng mặt nhẹ lên',
  'Cúi mặt nhẹ xuống'
];
let faceModelsPromise = null;
let faceCameraStream = null;
let faceRegistrationStudents = [];
let faceCapturedVectors = [];
let faceCaptureBusy = false;
let faceSelectedStudent = null;
let avatarStudents = [];
let avatarSelectedStudent = null;
let avatarBusy = false;
let avatarDeleteStudent = null;
let activeClassPickerSelect = null;
let studentNoteBusy = false;
let studentNoteTarget = null;
let attendanceWarmupTimer = null;
let attendanceWarmupKey = '';
let absenceStatsTimer = null;
let attendanceStatusByStudent = {};

/**
 * Thay các ô Lớp, Giáo viên và Môn học bằng danh sách HTML tùy chỉnh.
 * Android/iPhone áp dụng ngay khi chạm, không hiện Next hoặc "H.tất".
 */
function setupClassPickers() {
  ['classSelect', 'teacherSelect', 'subjectSelect', 'faceClassSelect', 'avatarClassSelect'].forEach(function(selectId) {
    const select = document.getElementById(selectId);
    if (!select || select.dataset.customClassPicker === '1') return;
    select.dataset.customClassPicker = '1';
    select.classList.add('class-native-select');

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = (select.closest('.select-wrap') ? 'filter-select ' : 'face-select ') + 'class-picker-trigger';
    trigger.setAttribute('aria-haspopup', 'dialog');
    trigger.dataset.classPickerFor = selectId;
    select.insertAdjacentElement('afterend', trigger);

    trigger.addEventListener('click', function() { openClassPicker(selectId); });
    select.addEventListener('change', function() { syncClassPickerTrigger(select); });
    new MutationObserver(function() { syncClassPickerTrigger(select); }).observe(select, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['disabled']
    });
    syncClassPickerTrigger(select);
  });

  document.getElementById('closeClassPicker').addEventListener('click', closeClassPicker);
  document.getElementById('classPickerOverlay').addEventListener('click', function(event) {
    if (event.target === this) closeClassPicker();
  });
}

function syncClassPickerTrigger(select) {
  if (!select) return;
  const trigger = document.querySelector('[data-class-picker-for="' + select.id + '"]');
  if (!trigger) return;
  const option = select.options[select.selectedIndex] || select.options[0];
  trigger.textContent = option ? option.textContent : 'Chọn lớp';
  trigger.disabled = Boolean(select.disabled);
  trigger.setAttribute('aria-label', trigger.textContent);
}

function openClassPicker(selectId) {
  const select = document.getElementById(selectId);
  if (!select || select.disabled) return;
  activeClassPickerSelect = select;
  const pickerTitles = {
    classSelect: 'Chọn lớp',
    teacherSelect: 'Chọn giáo viên',
    subjectSelect: 'Chọn môn học',
    faceClassSelect: 'Chọn lớp',
    avatarClassSelect: 'Chọn lớp'
  };
  const pickerTitle = pickerTitles[selectId] || 'Chọn nội dung';
  document.getElementById('classPickerTitle').textContent = pickerTitle;
  const list = document.getElementById('classPickerList');
  list.dataset.pickerFor = selectId;
  list.innerHTML = '';

  const options = Array.from(select.options).filter(function(option) { return Boolean(option.value); });
  options.forEach(function(option) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'class-picker-option' + (option.value === select.value ? ' current' : '');
    button.textContent = option.textContent;
    button.addEventListener('click', function() {
      const changed = select.value !== option.value;
      select.value = option.value;
      syncClassPickerTrigger(select);
      closeClassPicker();
      if (changed) select.dispatchEvent(new Event('change', { bubbles: true }));
    });
    list.appendChild(button);
  });

  if (!options.length) list.innerHTML = '<div class="class-picker-empty">Chưa có nội dung để lựa chọn.</div>';
  const overlay = document.getElementById('classPickerOverlay');
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
}

function closeClassPicker() {
  const overlay = document.getElementById('classPickerOverlay');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  activeClassPickerSelect = null;
}

function normalizeSubjectText(value) {
  return String(value || '').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/\s+/g, ' ');
}

/**
 * Bảo đảm hai trường H/I luôn có chỗ hiển thị, kể cả khi HTML được ghép từ
 * một mẫu giao diện cũ. Bình thường hai dòng đã có sẵn nên hàm không tạo lại.
 */
function ensureSubjectProgressRows() {
  const body = document.querySelector('.subject-profile-body');
  if (!body) return;

  const totalValue = document.getElementById('subjectInfoTongSoGio');
  let anchor = totalValue ? totalValue.closest('.info-row') : null;

  function ensureRow(id, field, label) {
    const existingValue = document.getElementById(id);
    if (existingValue) {
      anchor = existingValue.closest('.info-row') || anchor;
      return;
    }

    const row = document.createElement('div');
    row.className = 'info-row subject-progress-row';
    row.dataset.subjectField = field;

    const key = document.createElement('span');
    key.className = 'k';
    key.textContent = label;

    const value = document.createElement('span');
    value.className = 'v';
    value.id = id;
    value.textContent = '—';

    row.appendChild(key);
    row.appendChild(value);
    if (anchor && anchor.parentNode === body) {
      anchor.insertAdjacentElement('afterend', row);
    } else {
      body.appendChild(row);
    }
    anchor = row;
  }

  ensureRow('subjectInfoNgayBatDau', 'NgayBatDau', 'Ngày bắt đầu');
  ensureRow('subjectInfoTienDo', 'TienDo', 'Tiến độ giảng dạy');
}

function clearSubjectInfo() {
  ensureSubjectProgressRows();
  setText('subjectInfoName', '—');
  setText('subjectInfoHocKy', '—');
  setText('subjectInfoTongSoGio', '—');
  setText('subjectInfoNgayBatDau', '—');
  setText('subjectInfoTienDo', '—');
  setText('subjectInfoDanhSachMH', '—');
  setText('subjectInfoThucHanh', '—');
  setText('subjectInfoThi', '—');
}

function updateSubjectInfo() {
  ensureSubjectProgressRows();
  const select = document.getElementById('subjectSelect');
  const selectedName = select ? String(select.value || '').trim() : '';

  if (!selectedName || !Array.isArray(subjectDetails)) {
    clearSubjectInfo();
    return;
  }

  const wanted = normalizeSubjectText(selectedName);
  const info = subjectDetails.find(function(item) {
    return normalizeSubjectText(item.TenMH) === wanted;
  });

  if (!info) {
    clearSubjectInfo();
    setText('subjectInfoName', selectedName);
    return;
  }

  setText('subjectInfoName', info.TenMH || selectedName);
  setText('subjectInfoHocKy', info.HocKy || '—');
  setText('subjectInfoTongSoGio', info.TongSoGio || '—');
  setText('subjectInfoNgayBatDau', info.NgayBatDau || '—');
  setText('subjectInfoTienDo', formatStudyProgress(info.TienDo, info.TongSoGio));
  setText('subjectInfoDanhSachMH', info.DanhSachMH || '—');
  setText('subjectInfoThucHanh', info.ThucHanh || '—');
  setText('subjectInfoThi', info.Thi || '—');
}

function formatStudyProgress(progress, totalHours) {
  const cleanProgress = String(progress == null ? '' : progress)
    .trim().replace(/\s*giờ\s*$/i, '');
  const cleanTotal = String(totalHours == null ? '' : totalHours)
    .trim().replace(/\s*giờ\s*$/i, '');
  if (!cleanProgress && !cleanTotal) return '—';
  return (cleanProgress || '0') + '/' + (cleanTotal || '—') + ' giờ';
}



/** Khi WebApp mở chỉ tải danh sách lớp; GV và môn được tải theo lớp đã chọn. */
function loadAppConfig() {
  // Hiện danh sách đã dùng gần nhất ngay, không bắt người dùng nhìn ô tải trống
  // trong lúc Apps Script khởi động và kiểm tra lại INFO ở nền.
  try {
    const cachedClasses = JSON.parse(localStorage.getItem(STORAGE_CLASSES) || '[]');
    if (Array.isArray(cachedClasses) && cachedClasses.length) {
      fillSelect('classSelect', cachedClasses, 'Chọn lớp');
      restoreSelectValue('classSelect', localStorage.getItem(STORAGE_DEFAULT_CLASS));
    }
  } catch (error) {
    localStorage.removeItem(STORAGE_CLASSES);
  }

  setSelectWaiting('teacherSelect', 'Chọn lớp trước');
  setSelectWaiting('subjectSelect', 'Chọn lớp trước');

  bindSelectionEvents();

  // Nếu đã nhớ lớp, bắt đầu tải lớp ngay; không chờ lượt kiểm tra INFO kết thúc.
  const cachedClass = document.getElementById('classSelect').value;
  if (cachedClass) loadSelectedClass();

  google.script.run
    .withSuccessHandler(function(config) {
      const classes = config.classes || [];
      fillSelect('classSelect', classes, 'Chọn lớp');
      localStorage.setItem(STORAGE_CLASSES, JSON.stringify(classes));

      setupStudentSwipe();
      restoreSelectValue('classSelect', localStorage.getItem(STORAGE_DEFAULT_CLASS));

      // Nếu thiết bị đã nhớ một lớp hợp lệ thì tự tải lớp đó ngay khi mở WebApp.
      if (document.getElementById('classSelect').value &&
          currentClassName !== document.getElementById('classSelect').value) {
        loadSelectedClass();
      } else if (!document.getElementById('classSelect').value) {
        showNoStudent(classes.length ? 'Chọn lớp để tải học sinh' : 'Chưa có lớp được cấu hình');
      }
    })
    .withFailureHandler(function(error) {
      // Không xóa lớp đã tải được từ bộ nhớ trình duyệt nếu INFO tạm thời lỗi.
      if (!currentClassName) showNoStudent('Không tải được danh sách lớp');
      alert('Không tải được dữ liệu:\n' + getErrorMessage(error));
    })
    .getAppConfig();
}

/** Chỉ gắn sự kiện một lần, trước cả khi Google trả dữ liệu về. */
function bindSelectionEvents() {
  const classSelect = document.getElementById('classSelect');
  const teacherSelect = document.getElementById('teacherSelect');
  const subjectSelect = document.getElementById('subjectSelect');
  if (classSelect.dataset.eventsBound === '1') return;
  classSelect.dataset.eventsBound = '1';

  classSelect.addEventListener('change', function() {
    if (this.value) localStorage.setItem(STORAGE_DEFAULT_CLASS, this.value);
    loadSelectedClass();
  });
  teacherSelect.addEventListener('change', function() {
    if (this.value) localStorage.setItem(STORAGE_DEFAULT_TEACHER, this.value);
    prepareSubjectSelection();
  });
  subjectSelect.addEventListener('change', function() {
    const className = classSelect.value;
    if (className && this.value) {
      localStorage.setItem(STORAGE_SUBJECT_PREFIX + className, this.value);
    }
    updateSubjectInfo();
    attendanceWarmupKey = '';
    warmAttendanceSession();
  });
}

function readCachedClassTeachers(className) {
  try {
    const value = JSON.parse(
      localStorage.getItem(STORAGE_TEACHERS_PREFIX + String(className || '')) || '[]'
    );
    return Array.isArray(value) ? value.filter(Boolean) : [];
  } catch (error) {
    localStorage.removeItem(STORAGE_TEACHERS_PREFIX + String(className || ''));
    return [];
  }
}

function applyClassTeachers(className, teachers) {
  const list = Array.isArray(teachers) ? teachers.filter(Boolean) : [];
  const teacherSelect = document.getElementById('teacherSelect');
  const selectedTeacher = teacherSelect.value || localStorage.getItem(STORAGE_DEFAULT_TEACHER);
  fillSelect('teacherSelect', list, list.length ? 'Chọn giáo viên' : 'Chưa có giáo viên');
  restoreSelectValue('teacherSelect', selectedTeacher);
  try {
    localStorage.setItem(STORAGE_TEACHERS_PREFIX + className, JSON.stringify(list));
  } catch (error) {
    // Thiết bị chặn bộ nhớ cục bộ vẫn dùng bình thường với dữ liệu máy chủ.
  }
}

/** Tải môn học và danh sách học sinh khi người dùng chọn lớp. */
function loadSelectedClass() {
  const className = document.getElementById('classSelect').value;
  const requestId = ++loadingRequest;
  currentClassName = className;
  students = [];
  attendanceStatusByStudent = {};
  currentSubjects = [];
  subjectDetails = [];
  attendanceWarmupKey = '';
  clearTimeout(attendanceWarmupTimer);
  clearTimeout(absenceStatsTimer);
  clearSubjectInfo();
  adjacentPhotoCache.clear();
  profilePhotoDataCache.clear();
  profilePhotoProxyPending.clear();
  profilePhotoProxyMode = false;
  profilePhotoPreloadGeneration++;
  currentStudentIndex = 0;

  if (!className) {
    setSelectWaiting('teacherSelect', 'Chọn lớp trước');
    setSelectWaiting('subjectSelect', 'Chọn lớp trước');
    showNoStudent('Chọn lớp để tải học sinh');
    return;
  }

  const cachedTeachers = readCachedClassTeachers(className);
  if (cachedTeachers.length) {
    applyClassTeachers(className, cachedTeachers);
  } else {
    setSelectWaiting('teacherSelect', 'Đang tải giáo viên...');
  }
  setSelectWaiting('subjectSelect', 'Chọn giáo viên trước');
  showNoStudent('Đang tải dữ liệu lớp ' + className + '...');

  // Chỉ gọi Apps Script một lần. Danh sách GV đã nhớ được hiện ngay phía trên;
  // bản mới cùng môn học/học sinh sẽ về chung trong phản hồi này.
  google.script.run
    .withSuccessHandler(function(data) {
      if (requestId !== loadingRequest) return;
      applyClassTeachers(className, data.teachers || []);
      currentSubjects = Array.isArray(data.subjects) ? data.subjects : [];
      subjectDetails = Array.isArray(data.subjectDetails) ? data.subjectDetails : [];
      prepareSubjectSelection();
      students = Array.isArray(data.students) ? data.students : [];
      currentStudentIndex = 0;
      if (!students.length) {
        showNoStudent('Không có học sinh trong lớp ' + className);
        return;
      }
      showStudent(0);
      warmAttendanceSession();
    })
    .withFailureHandler(function(error) {
      if (requestId !== loadingRequest) return;
      students = [];
      currentStudentIndex = 0;
      showNoStudent('Lỗi tải dữ liệu lớp ' + className);
      alert('Không tải được lớp ' + className + ':\n' + getErrorMessage(error));
    })
    .getClassData(className, document.getElementById('attendanceDate').value);
}

/** Chỉ mở bước chọn môn sau khi đã chọn giáo viên. */
function prepareSubjectSelection() {
  const teacherSelect = document.getElementById('teacherSelect');
  if (!teacherSelect || !teacherSelect.value) {
    setSelectWaiting('subjectSelect', 'Chọn giáo viên trước');
    clearSubjectInfo();
    return;
  }
  fillSelect('subjectSelect', currentSubjects, 'Chọn môn học');
  restoreLastSubject(document.getElementById('classSelect').value);
  updateSubjectInfo();
  warmAttendanceSession();
}

function getActiveSessionCode() {
  const activeSession = document.querySelector('.session-btn.active');
  const sessionButtons = Array.from(document.querySelectorAll('.session-btn'));
  return sessionButtons.indexOf(activeSession) === 1 ? 'C' : 'S';
}

function scheduleAbsenceStats(delay) {
  clearTimeout(absenceStatsTimer);
  absenceStatsTimer = setTimeout(function() {
    absenceStatsTimer = null;
    if (!attendanceSaving) loadAbsenceStats();
  }, Number(delay) >= 0 ? Number(delay) : 250);
}

function cancelPendingAttendanceBackground() {
  clearTimeout(attendanceWarmupTimer);
  clearTimeout(absenceStatsTimer);
  attendanceWarmupTimer = null;
  absenceStatsTimer = null;
  // Kết quả thống kê cũ đang trên đường về sẽ không được đưa lên giao diện.
  absenceStatsRequest++;
}

/**
 * Chờ người dùng dừng thao tác rồi mới nạp ngầm. Thống kê V/P chỉ chạy sau
 * khi nạp ngầm hoàn tất để không có hai yêu cầu tranh với thao tác lưu.
 */
function warmAttendanceSession() {
  const className = document.getElementById('classSelect').value;
  const dateInput = document.getElementById('attendanceDate');
  const subject = document.getElementById('subjectSelect').value;
  if (!className || !dateInput || !dateInput.value || !subject || !students.length) return;

  const student = students[0];
  const session = getActiveSessionCode();
  const key = [className, dateInput.value, session, normalizeSubjectText(subject)].join('|');
  if (attendanceWarmupKey === key) {
    scheduleAbsenceStats(250);
    return;
  }
  attendanceStatusByStudent = {};
  const openStudentList = document.getElementById('studentJumpOverlay');
  if (openStudentList && openStudentList.classList.contains('show')) {
    renderStudentJumpList(document.getElementById('studentJumpSearch').value);
  }
  clearTimeout(attendanceWarmupTimer);
  clearTimeout(absenceStatsTimer);
  attendanceWarmupTimer = setTimeout(function() {
    attendanceWarmupTimer = null;
    if (attendanceSaving) return;
    attendanceWarmupKey = key;
    google.script.run
      .withSuccessHandler(function(result) {
        applyAttendanceStatusData(result, key);
        const progress = result && result.subjectProgress;
        if (progress && normalizeSubjectText(progress.subject) === normalizeSubjectText(subject)) {
          const currentInfo = subjectDetails.find(function(item) {
            return normalizeSubjectText(item.TenMH) === normalizeSubjectText(progress.subject);
          });
          if (currentInfo) {
            currentInfo.NgayBatDau = progress.NgayBatDau || '';
            currentInfo.TienDo = progress.TienDo || '0';
            currentInfo._StoredNgayBatDau = progress.StoredNgayBatDau || '';
            currentInfo._StoredTienDo = progress.StoredTienDo || '0';
            currentInfo._SchoolYearStart = progress.schoolYearStart;
            if (normalizeSubjectText(document.getElementById('subjectSelect').value) === normalizeSubjectText(progress.subject)) {
              updateSubjectInfo();
            }
          }
        }
        scheduleAbsenceStats(120);
      })
      .withFailureHandler(function() {
        if (attendanceWarmupKey === key) attendanceWarmupKey = '';
        scheduleAbsenceStats(120);
      })
      .prepareAttendanceSession({
        className: className,
        attendanceDate: dateInput.value,
        session: session,
        subject: subject,
        studentSTT: student.STT,
        studentName: student.HoVaTen
      });
  }, 2500);
}

/** Cập nhật ký hiệu trong Danh sách lớp theo đúng ngày và buổi đang chọn. */
function applyAttendanceStatusData(result, key) {
  if (attendanceWarmupKey !== key) return;
  const next = {};
  const items = result && Array.isArray(result.attendanceStatuses) ? result.attendanceStatuses : [];
  items.forEach(function(item) {
    const stt = normalizeStudentStatusKey(item && item.studentSTT);
    const status = String(item && item.status || '').toUpperCase();
    if (stt && (status === 'PRESENT' || status === 'ABSENT' || status === 'EXCUSED')) next[stt] = status;
  });
  attendanceStatusByStudent = next;
  const overlay = document.getElementById('studentJumpOverlay');
  if (overlay && overlay.classList.contains('show')) renderStudentJumpList(document.getElementById('studentJumpSearch').value);
}

function normalizeStudentStatusKey(value) {
  const text = String(value == null ? '' : value).trim();
  const number = Number(text);
  return text && isFinite(number) ? String(number) : text;
}

function getStudentJumpStatus(student) {
  const status = attendanceStatusByStudent[normalizeStudentStatusKey(student && student.STT)];
  if (status === 'PRESENT') return { key: 'present', symbol: '✓', label: 'Có mặt' };
  if (status === 'ABSENT') return { key: 'absent', symbol: '×', label: 'Vắng' };
  if (status === 'EXCUSED') return { key: 'excused', symbol: 'P', label: 'Có phép' };
  return { key: 'unknown', symbol: '—', label: 'Chưa có trạng thái điểm danh' };
}

/** Hiển thị hồ sơ một học sinh theo vị trí trong danh sách. */
function showStudent(index, direction) {
  if (!students.length) return;
  index = Math.max(0, Math.min(index, students.length - 1));
  const student = students[index];
  currentStudentIndex = index;
  const quickListButton = document.getElementById('studentQuickListButton');
  if (quickListButton) quickListButton.disabled = false;

  animateStudentCard(direction, function() {
    setText('studentName', student.HoVaTen || 'Chưa có tên');
    setText('studentMeta', 'Lớp ' + (student.Lop || currentClassName || '—') +
      ' · Số thứ tự ' + (student.STT || (index + 1)) +
      ' · ' + (index + 1) + '/' + students.length);
    setText('studentId', student.MSSV || '—');
    showStudentPhoto(student.LinkAnh, student.HoVaTen, function() {
      scheduleAdjacentPhotoPreload(index);
      scheduleProxyAdjacentPhotoPreload(index);
    });
    setText('contactStudentName', student.HoVaTen || '—');
    setText('contactFatherName', student.TenCha || '—');
    setText('contactMotherName', student.TenMe || '—');
    setText('profileBirthDate', student.NgaySinh || '—');
    setText('profileCCCD', student.CCCD || '—');
    setText('profileBHYT', student.BHYT || '—');
    setText('profileFather', formatParentInfo(student.TenCha, student.SDT_Cha));
    setText('profileMother', formatParentInfo(student.TenMe, student.SDT_Me));
    setText('profileAddress', student.DiaChi || '—');
    setText('profileNote', String(student.GhiChu || '').trim());
    document.getElementById('profileNoteRow').setAttribute('aria-disabled', 'false');
    updateContactButtons('.contact-group.student', student.SDT_HS);
    updateContactButtons('.contact-group.father', student.SDT_Cha);
    updateContactButtons('.contact-group.mother', student.SDT_Me);
    clearAttendanceSelection();
    setAttendanceMessage('Chưa điểm danh');
    warmAttendanceSession();
  });
}

/** Mở ô nhập ghi chú của học sinh đang hiển thị. */
function openStudentNoteEditor() {
  if (!students.length || studentNoteBusy) return;
  const student = students[currentStudentIndex];
  if (!student || !currentClassName) return;

  studentNoteTarget = {
    className: currentClassName,
    studentSTT: String(student.STT || '').trim(),
    studentName: String(student.HoVaTen || '').trim()
  };

  input.value = String(student.GhiChu || '').trim();

  document.querySelector('.student-note-sheet').classList.remove('keyboard-active');

  input.scrollTop = 0;

/** Lưu ghi chú vào cột GhiChu; nội dung trống sẽ xóa ô trên Sheet. */
function saveCurrentStudentNote() {
  if (studentNoteBusy || !studentNoteTarget) return;
  const target = Object.assign({}, studentNoteTarget);
  const note = document.getElementById('studentNoteInput').value.trim();
  setStudentNoteBusy(true);
  setStudentNoteStatus('Đang lưu ghi chú...');

  google.script.run
    .withSuccessHandler(function(result) {
      const savedNote = String(result && result.note || '').trim();
      const matchingStudent = students.find(function(student) {
        const sameSTT = target.studentSTT && String(student.STT || '').trim() &&
          Number(student.STT) === Number(target.studentSTT);
        const sameName = normalizeSubjectText(student.HoVaTen) === normalizeSubjectText(target.studentName);
        return sameSTT || sameName;
      });
      if (matchingStudent) matchingStudent.GhiChu = savedNote;

      const currentStudent = students[currentStudentIndex];
      if (currentStudent === matchingStudent) setText('profileNote', savedNote);
      setStudentNoteBusy(false);
      closeStudentNoteEditor(true);
    })
    .withFailureHandler(function(error) {
      setStudentNoteBusy(false);
      setStudentNoteStatus('Không lưu được: ' + getErrorMessage(error), true);
    })
    .saveStudentNote({
      className: target.className,
      studentSTT: target.studentSTT,
      studentName: target.studentName,
      note: note
    });
}

function nextStudent() {
  if (students.length && currentStudentIndex < students.length - 1) {
    showStudent(currentStudentIndex + 1, 'left');

function previousStudent() {

/** Cho phép vuốt hoặc dùng phím mũi tên để chuyển học sinh. */
function setupStudentSwipe() {
  const screen = document.querySelector('.screen');
  if (!screen || screen.dataset.swipeReady === '1') return;
  screen.dataset.swipeReady = '1';

  screen.addEventListener('pointerdown', function(event) {
    if (event.target.closest('input, select, a, button, .status-btn, .session-btn, .contact-btn')) {
      pointerTracking = false;
      return;
    }
    pointerStartX = event.clientX;
    pointerStartY = event.clientY;
    pointerTracking = true;
  });
  screen.addEventListener('pointerup', function(event) {
    if (!pointerTracking) return;
    pointerTracking = false;
    const dx = event.clientX - pointerStartX;
    const dy = event.clientY - pointerStartY;
    if (Math.abs(dx) < 60 || Math.abs(dx) <= Math.abs(dy) * 1.2) return;
    if (dx < 0) nextStudent(); else previousStudent();
  });
  screen.addEventListener('pointercancel', function() { pointerTracking = false; });
  document.addEventListener('keydown', function(event) {
    if (event.target && event.target.closest && event.target.closest('input, select, textarea')) return;
    if (event.key === 'ArrowRight') nextStudent();
    if (event.key === 'ArrowLeft') previousStudent();
  });
}

function animateStudentCard(direction, updateFunction) {
  const card = document.getElementById('studentCard');
  if (!card) { updateFunction(); return; }
  card.classList.remove('swipe-out-left', 'swipe-out-right', 'swipe-in');
  if (!direction) { updateFunction(); card.classList.add('swipe-in'); return; }
  card.classList.add(direction === 'left' ? 'swipe-out-left' : 'swipe-out-right');
  setTimeout(function() {
    updateFunction();
    card.classList.remove('swipe-out-left', 'swipe-out-right');
    card.classList.add('swipe-in');
  }, 130);
}

async function processFaceVideo(event) {
  const file = event.target.files && event.target.files[0];
  if (!file || !faceSelectedStudent || faceCaptureBusy) return;
  faceCaptureBusy = true;
  const button = document.getElementById('faceVideoButton');
  button.disabled = true;
  document.getElementById('faceCancelButton').disabled = true;
  setFaceMessage('Đang tải mô hình và phân tích video...');
  try {
    await loadFaceModels();
    const video = document.getElementById('faceVideoDecoder');
    const objectUrl = URL.createObjectURL(file);
    video.dataset.objectUrl = objectUrl;
    video.src = objectUrl;
    await waitForVideoMetadata(video);
    if (!isFinite(video.duration) || video.duration < 4) throw new Error('Video quá ngắn. Hãy quay khoảng 8–12 giây.');
    if (video.duration > 35) throw new Error('Video quá dài. Hãy quay lại khoảng 8–12 giây.');

    const results = await extractFaceIdFrames(video);
    faceCapturedVectors = results.map(function(item) { return Array.from(item.descriptor); });

    document.getElementById('faceGuide').textContent = 'Đã nhận đủ 5 hướng';
    setFaceMessage('Đang lưu 5 vector khuôn mặt...', 'success');
    saveFaceRegistrationToGoogle();
  } catch (error) {
    setFaceMessage(getErrorMessage(error), 'error');
    document.getElementById('faceGuide').textContent = 'Chưa đạt, vui lòng quay lại';
  } finally {
    const savingToGoogle = faceCapturedVectors.length === 5;
    faceCaptureBusy = savingToGoogle;
    button.disabled = savingToGoogle;
    document.getElementById('faceCancelButton').disabled = savingToGoogle;
  }
}

function waitForVideoMetadata(video) {
  return new Promise(function(resolve, reject) {
    if (video.readyState >= 1 && isFinite(video.duration)) return resolve();
    const timer = setTimeout(function() { reject(new Error('Không đọc được video trên trình duyệt này.')); }, 15000);
    video.onloadedmetadata = function() { clearTimeout(timer); resolve(); };
    video.onerror = function() { clearTimeout(timer); reject(new Error('Định dạng video không được trình duyệt hỗ trợ.')); };
    video.load();
  });
}

function seekVideo(video, time) {
  return new Promise(function(resolve, reject) {
    const safeTime = Math.max(0, Math.min(time, Math.max(0, video.duration - 0.05)));
    if (Math.abs(video.currentTime - safeTime) < 0.02 && video.readyState >= 2) return resolve();
    const timer = setTimeout(function() { reject(new Error('Không lấy được khung hình từ video.')); }, 10000);
    video.onseeked = function() { clearTimeout(timer); resolve(); };
    video.onerror = function() { clearTimeout(timer); reject(new Error('Không đọc được khung hình video.')); };
    video.currentTime = safeTime;
  });
}

function drawVideoFrame(video) {
  const canvas = document.getElementById('faceCaptureCanvas');
  const scale = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
  canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
  canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas;
}

function facePoseMetrics(landmarks) {
  const points = landmarks.positions;
  function center(indices) {
    const total = indices.reduce(function(sum, index) {
      return { x: sum.x + points[index].x, y: sum.y + points[index].y };
    }, { x: 0, y: 0 });
    return { x: total.x / indices.length, y: total.y / indices.length };
  }
  const leftEye = center([36,37,38,39,40,41]);
  const rightEye = center([42,43,44,45,46,47]);
  const eyeMid = { x: (leftEye.x + rightEye.x) / 2, y: (leftEye.y + rightEye.y) / 2 };
  const mouth = center([48,54]);
  const nose = points[30];
  const eyeDistance = Math.max(1, Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y));
  const eyeMouthDistance = Math.max(1, mouth.y - eyeMid.y);
  return { yaw: (nose.x - eyeMid.x) / eyeDistance, pitch: (nose.y - eyeMid.y) / eyeMouthDistance };
}

async function extractFaceIdFrames(video) {
  const centers = [0.10, 0.30, 0.50, 0.70, 0.90];
  const offsets = [-0.045, 0, 0.045];
  const segments = [];
  for (let pose = 0; pose < centers.length; pose++) {
    const candidates = [];
    for (let sample = 0; sample < offsets.length; sample++) {
      const time = video.duration * Math.max(0.02, Math.min(0.98, centers[pose] + offsets[sample]));
      await seekVideo(video, time);
      const canvas = drawVideoFrame(video);
      const detections = await faceapi
        .detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.55 }))
        .withFaceLandmarks()
        .withFaceDescriptors();
      if (detections.length === 1 && detections[0].detection.box.width >= canvas.width * 0.20) {
        const metrics = facePoseMetrics(detections[0].landmarks);
        candidates.push({
          time: time,
          score: detections[0].detection.score,
          descriptor: detections[0].descriptor,
          box: detections[0].detection.box,
          yaw: metrics.yaw,
          pitch: metrics.pitch
        });
      }
      document.getElementById('faceAnalysisBar').style.width = Math.round(((pose * offsets.length + sample + 1) / 15) * 100) + '%';
    }
    if (!candidates.length) throw new Error('Không thấy rõ khuôn mặt ở đoạn ' + (pose + 1) + '/5. Hãy quay lại, đủ sáng và chỉ có một người.');
    candidates.sort(function(a, b) { return b.score - a.score; });
    segments.push(candidates[0]);
  }

  if (Math.abs(segments[1].yaw - segments[2].yaw) < 0.06) {
    throw new Error('Chưa ghi nhận rõ hai hướng trái và phải. Hãy xoay mặt chậm và rõ hơn.');
  }
  if (Math.abs(segments[3].pitch - segments[4].pitch) < 0.025) {
    throw new Error('Chưa ghi nhận rõ hai hướng ngẩng lên và cúi xuống. Hãy thực hiện rõ hơn.');
  }
  return segments;
}

function cropFacePhoto(sourceCanvas, box) {
  const margin = Math.max(box.width, box.height) * 0.65;
  const size = Math.min(sourceCanvas.width, sourceCanvas.height, Math.max(box.width, box.height) + margin * 2);
  let x = box.x + box.width / 2 - size / 2;
  let y = box.y + box.height / 2 - size / 2;
  x = Math.max(0, Math.min(x, sourceCanvas.width - size));
  y = Math.max(0, Math.min(y, sourceCanvas.height - size));
  const output = document.createElement('canvas');
  output.width = 480; output.height = 480;
  output.getContext('2d').drawImage(sourceCanvas, x, y, size, size, 0, 0, 480, 480);
  return output.toDataURL('image/jpeg', 0.86);
}

    image.onerror = function() { URL.revokeObjectURL(objectUrl); reject(new Error('Không đọc được ảnh vừa chụp.')); };
    image.src = objectUrl;
  });
}

async function processAvatarPhoto(event) {
  const file = event.target.files && event.target.files[0];
  const student = avatarSelectedStudent;
  if (!file || !student || avatarBusy) return;
  avatarBusy = true;
  document.getElementById('avatarClassSelect').disabled = true;
  setAvatarMessage('Đang kiểm tra khuôn mặt trong ảnh...');
  let loaded = null;
  try {
    await loadFaceModels();
    loaded = await loadAvatarImage(file);
    const canvas = document.getElementById('avatarCaptureCanvas');
    const scale = Math.min(1, 1280 / Math.max(loaded.image.naturalWidth, loaded.image.naturalHeight));
    canvas.width = Math.max(1, Math.round(loaded.image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(loaded.image.naturalHeight * scale));
    canvas.getContext('2d').drawImage(loaded.image, 0, 0, canvas.width, canvas.height);
    const detections = await faceapi.detectAllFaces(canvas,
      new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.55 }));
    if (detections.length !== 1) throw new Error(detections.length ? 'Ảnh có nhiều khuôn mặt. Hãy chụp riêng một học sinh.' : 'Không thấy rõ khuôn mặt. Hãy chụp lại nơi đủ sáng.');
    if (detections[0].box.width < canvas.width * 0.16) throw new Error('Khuôn mặt còn quá nhỏ. Hãy đưa máy lại gần hơn.');
    const photoDataUrl = cropFacePhoto(canvas, detections[0].box);
    setAvatarMessage('Đang lưu ảnh đại diện lên Drive...');
    google.script.run
      .withSuccessHandler(function(result) {
        student.LinkAnh = result.linkAnh;
        if (document.getElementById('avatarClassSelect').value === currentClassName) {
          const sameStudent = students.find(function(item) { return Number(item.STT) === Number(student.STT); });
          if (sameStudent) sameStudent.LinkAnh = result.linkAnh;
          if (students[currentStudentIndex] && Number(students[currentStudentIndex].STT) === Number(student.STT)) {
            showStudentPhoto(result.linkAnh, student.HoVaTen);
          }
        }
        avatarBusy = false;
        avatarSelectedStudent = null;
        document.getElementById('avatarClassSelect').disabled = false;
        renderAvatarStudentList(avatarStudents);
        setAvatarMessage('Đã lưu ảnh đại diện cho ' + student.HoVaTen + '.', 'success');
      })
      .withFailureHandler(function(error) {
        avatarBusy = false;
        avatarSelectedStudent = null;
        document.getElementById('avatarClassSelect').disabled = false;
        setAvatarMessage('Lưu thất bại: ' + getErrorMessage(error), 'error');
      })
      .saveStudentProfilePhoto({
        className: document.getElementById('avatarClassSelect').value,
        studentSTT: student.STT,
        studentName: student.HoVaTen,
        photoDataUrl: photoDataUrl
      });
  } catch (error) {
    avatarBusy = false;
    avatarSelectedStudent = null;
    document.getElementById('avatarClassSelect').disabled = false;
    setAvatarMessage(getErrorMessage(error), 'error');
  } finally {
    if (loaded && loaded.objectUrl) URL.revokeObjectURL(loaded.objectUrl);
  }
}

/**

function loadAbsenceStats() {
  const requestId = ++absenceStatsRequest;
  const dateInput = document.getElementById('attendanceDate');
  const subjectSelect = document.getElementById('subjectSelect');
  const title = document.getElementById('absenceStatsTitle');
  const subjectLabel = document.getElementById('absenceStatsSubject');

  const excusedLabel = document.getElementById('excusedAbsenceLabel');
  const absentElement = document.getElementById('unexcusedAbsenceCount');
  const absentLabel = document.getElementById('unexcusedAbsenceLabel');

  if (!dateInput || !dateInput.value || !subjectSelect || !subjectSelect.value || !students.length) {
    if (title && dateInput && dateInput.value) {
      title.textContent = 'Thống kê tháng ' + Number(dateInput.value.split('-')[1]) + ': — buổi';
    }
    if (subjectLabel) subjectLabel.textContent = subjectSelect && subjectSelect.value ? subjectSelect.value : 'Chọn môn học';
    if (excusedElement) excusedElement.textContent = '—';
    if (excusedLabel) excusedLabel.textContent = 'Buổi vắng có phép - — giờ';
    if (absentElement) absentElement.textContent = '—';
    if (absentLabel) absentLabel.textContent = 'Buổi vắng không phép - — giờ';
    return;
  }

  const student = students[currentStudentIndex];
  title.textContent = 'Thống kê tháng ' + Number(dateInput.value.split('-')[1]) + ': — buổi';
  subjectLabel.textContent = subjectSelect.value;
  excusedElement.textContent = '…';
  absentElement.textContent = '…';

  google.script.run
    .withSuccessHandler(function(result) {
      if (requestId !== absenceStatsRequest) return;
      title.textContent = 'Thống kê tháng ' + result.month + ': ' +
        (Number(result.excused) + Number(result.absent)) + ' buổi';
      subjectLabel.textContent = result.subject;
      excusedElement.textContent = result.excused;
      excusedLabel.textContent = 'Buổi vắng có phép - ' + (Number(result.excused) * 4) + ' giờ';
      absentElement.textContent = result.absent;
      absentLabel.textContent = 'Buổi vắng không phép - ' + (Number(result.absent) * 4) + ' giờ';
    })
    .withFailureHandler(function(error) {
      if (requestId !== absenceStatsRequest) return;
      excusedElement.textContent = '—';
      excusedLabel.textContent = 'Buổi vắng có phép - — giờ';
      absentElement.textContent = '—';
      absentLabel.textContent = 'Buổi vắng không phép - — giờ';
      subjectLabel.textContent = 'Không tải được';
      console.error(getErrorMessage(error));
    })
    .getAbsenceStats({
      className: document.getElementById('classSelect').value,
      studentSTT: student.STT,
      studentName: student.HoVaTen,
      attendanceDate: dateInput.value,
      subject: subjectSelect.value
    });
}

/** Gửi một lần điểm danh sang Code.gs để ghi vào đúng ô Google Sheets. */
function submitAttendance(button) {
  if (attendanceSaving || !students.length) return;

  // Dừng các tác vụ nền chưa chạy để yêu cầu ghi là tác vụ Google duy nhất.
  cancelPendingAttendanceBackground();

  const student = students[currentStudentIndex];
  const dateInput = document.getElementById('attendanceDate');
  const classSelect = document.getElementById('classSelect');
  const teacherSelect = document.getElementById('teacherSelect');
  const subjectSelect = document.getElementById('subjectSelect');
  const session = getActiveSessionCode();

  if (!dateInput || !dateInput.value) {
    alert('Chưa chọn ngày điểm danh.');
    return;
  }

  const wantedSubject = normalizeSubjectText(subjectSelect.value);
  const cachedSubjectInfo = subjectDetails.find(function(item) {
    return normalizeSubjectText(item.TenMH) === wantedSubject;
  }) || null;

  const payload = {
    className: classSelect.value,
    studentSTT: student.STT,
    studentName: student.HoVaTen,
    attendanceDate: dateInput.value,
    session: session,
    status: button.dataset.status,
    teacher: teacherSelect.value,
    subject: subjectSelect.value,
    // Đã nạp khi chọn lớp; Code.gs dùng lại nếu cache máy chủ tạm thời bị mất.
    subjectSnapshot: cachedSubjectInfo ? {
      TenMH: cachedSubjectInfo.TenMH,
      row: cachedSubjectInfo._Row,
      subjectColumn: cachedSubjectInfo._SubjectColumn,
      startDateColumn: cachedSubjectInfo._StartDateColumn,
      progressColumn: cachedSubjectInfo._ProgressColumn,
      schoolYearStart: cachedSubjectInfo._SchoolYearStart,
      NgayBatDau: cachedSubjectInfo.NgayBatDau,
      TienDo: cachedSubjectInfo.TienDo,
      TongSoGio: cachedSubjectInfo.TongSoGio,
      StoredNgayBatDau: cachedSubjectInfo._StoredNgayBatDau,
      StoredTienDo: cachedSubjectInfo._StoredTienDo
    } : null
  };

  attendanceSaving = true;
  setAttendanceButtonsBusy(true);
  setAttendanceMessage('Đang ghi điểm danh...');

  google.script.run
    .withSuccessHandler(function(result) {
      attendanceSaving = false;
      setAttendanceButtonsBusy(false);
      clearAttendanceSelection();
      button.classList.add('selected');

      const statusName = result.mark === 'V'
        ? 'Vắng'
        : result.mark === 'P'
          ? 'Có phép'
          : 'Có mặt';
      const sessionName = result.session === 'C' ? 'Buổi chiều' : 'Buổi sáng';
      const makeupText = result.isMakeup ? ' · Điểm danh bù' : '';
      setAttendanceMessage(
        'Đã ghi ' + statusName + ' · ' + sessionName + makeupText +
        ' · ' + result.sheetName + ' · Ô ' + result.cell
      );
      // Code.gs vừa trả về cả lớp của đúng cột đã ghi, nên Danh sách lớp đổi
      // trạng thái ngay cả khi cửa sổ này đang mở.
      applyAttendanceStatusData(result, attendanceWarmupKey);
      attendanceStatusByStudent[normalizeStudentStatusKey(student.STT)] =
        result.mark === 'V' ? 'ABSENT' : result.mark === 'P' ? 'EXCUSED' : 'PRESENT';
      const studentJumpOverlay = document.getElementById('studentJumpOverlay');
      if (studentJumpOverlay && studentJumpOverlay.classList.contains('show')) {
        renderStudentJumpList(document.getElementById('studentJumpSearch').value);
      }
      if (result.subjectProgress) {
        const wantedSubject = normalizeSubjectText(payload.subject);
        const subjectInfo = subjectDetails.find(function(item) {
          return normalizeSubjectText(item.TenMH) === wantedSubject;
        });
        if (subjectInfo) {
          subjectInfo.NgayBatDau = result.subjectProgress.NgayBatDau || '';
          subjectInfo.TienDo = result.subjectProgress.TienDo || '0';
          subjectInfo._StoredNgayBatDau = result.subjectProgress.StoredNgayBatDau || subjectInfo.NgayBatDau;
          subjectInfo._StoredTienDo = result.subjectProgress.StoredTienDo || subjectInfo.TienDo;
          subjectInfo._SchoolYearStart = result.subjectProgress.schoolYearStart;
          updateSubjectInfo();
        }
      }
      // Hiển thị trạng thái "Đã ghi" trước; thống kê V/P tải lại ở nền.
      scheduleAbsenceStats(120);
    })
    .withFailureHandler(function(error) {
      attendanceSaving = false;
      setAttendanceButtonsBusy(false);
      setAttendanceMessage('Ghi điểm danh thất bại');
      alert('Không ghi được điểm danh:\n' + getErrorMessage(error));
    })
    .saveAttendance(payload);
}

  const cleanPhone = normalizePhoneNumber(phone);
  const zaloPhone = toVietnameseLocalPhone(cleanPhone);
  buttons.forEach(function(button, index) {
    button.style.opacity = cleanPhone ? '1' : '.45';
    button.onclick = function() {
      if (!cleanPhone) {
        alert('Chưa có số điện thoại cho người này.');

      // iframe bảo mật của Google Apps Script và mở ứng dụng Điện thoại.

      if (index === 1) openPhoneAction('https://zalo.me/' + zaloPhone);

function normalizePhoneNumber(phone) {
  let value = String(phone || '').trim().replace(/[^\d+]/g, '');
  if (value.indexOf('0084') === 0) value = '+84' + value.slice(4);
  if (value.indexOf('84') === 0 && value.charAt(0) !== '+') value = '+' + value;
  return value;
}

function toVietnameseLocalPhone(phone) {
  const value = String(phone || '');
  if (value.indexOf('+84') === 0) return '0' + value.slice(3);
  if (value.indexOf('84') === 0) return '0' + value.slice(2);
  return value;
}

/** Chỉ khôi phục khi giá trị cũ vẫn còn tồn tại trong danh sách hiện tại. */
function restoreSelectValue(selectId, savedValue) {
  const select = document.getElementById(selectId);
  if (!select || !savedValue) return false;
  const exists = Array.from(select.options).some(function(option) {
    return option.value === savedValue;
  });
  if (exists) select.value = savedValue;
  syncClassPickerTrigger(select);
  return exists;
}

function formatParentInfo(name, phone) {
  const cleanName = String(name || '').trim();
  const cleanPhone = String(phone || '').trim();
  if (!cleanName && !cleanPhone) return '—';
  if (cleanName && cleanPhone) return cleanName + ' · ' + cleanPhone;
  return cleanName || cleanPhone;
}
function makeInitials(name) {
  const text = String(name || '').trim();
  if (!text) return '--';
  const words = text.split(/\s+/);
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[words.length - 2][0] + words[words.length - 1][0]).toUpperCase();
}

/**
 * Giữ LinkAnh trong Google Sheets ở dạng đầy đủ; giao diện tự lấy ID Drive.
 * Hỗ trợ các dạng /file/d/ID, open?id=ID, uc?id=ID và thumbnail?id=ID.
 */
function getStudentPhotoUrl(fullLink) {
  const link = String(fullLink || '').trim();
  if (!link) return '';

  const drivePatterns = [
    /\/file\/d\/([a-zA-Z0-9_-]{20,})/,
    /[?&]id=([a-zA-Z0-9_-]{20,})/,
    /\/d\/([a-zA-Z0-9_-]{20,})/
  ];
  for (let i = 0; i < drivePatterns.length; i++) {
    const match = link.match(drivePatterns[i]);
    if (match) {
      const resourceKeyMatch = link.match(/[?&]resourcekey=([a-zA-Z0-9_-]+)/i);
      return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(match[1]) +
        (resourceKeyMatch ? '&resourcekey=' + encodeURIComponent(resourceKeyMatch[1]) : '') +
        '&sz=w400';
    }
  }

  // Nếu LinkAnh là URL ảnh trực tiếp ngoài Drive thì vẫn hiển thị bình thường.
  if (/^https?:\/\//i.test(link)) return link;
  return '';
}

/** Hiển thị ảnh; tự quay về chữ viết tắt nếu ảnh trống, lỗi hoặc thiếu quyền xem. */
function showStudentPhoto(fullLink, studentName, onSettled) {
  const avatar = document.getElementById('studentAvatar');
  const image = document.getElementById('studentAvatarImage');
  const initials = document.getElementById('studentAvatarInitials');
  if (!avatar || !image || !initials) return;

  const imageUrl = getStudentPhotoUrl(fullLink);
  const largeImageUrl = imageUrl.replace(/([?&]sz=)w\d+/i, '$1w1600');
  const requestKey = imageUrl + '|' + String(studentName || '');
  const selectedStudent = students[currentStudentIndex] || {};
  const proxyPayload = {
    className: currentClassName,
    studentSTT: selectedStudent.STT || '',
    studentName: studentName || selectedStudent.HoVaTen || ''
  };
  const proxyCacheKey = getProfilePhotoDataCacheKey(currentClassName, {
    STT: proxyPayload.studentSTT,
    LinkAnh: fullLink
  });
  let viewerImageUrl = largeImageUrl;
  let proxyAttempted = false;
  avatar.dataset.photoRequest = requestKey;
  avatar.dataset.photoFullUrl = '';
  avatar.dataset.photoStudentName = '';
  avatar.classList.remove('has-photo');
  avatar.setAttribute('aria-disabled', 'true');
  avatar.setAttribute('aria-label', 'Chưa có ảnh để xem');
  initials.textContent = studentName ? makeInitials(studentName) : '--';
  image.removeAttribute('src');

  if (!imageUrl) {
    if (typeof onSettled === 'function') onSettled();
    return;
  }
  let settled = false;
  function clearPhoto() {
    if (avatar.dataset.photoRequest !== requestKey) return;
    avatar.classList.remove('has-photo');
    avatar.dataset.photoFullUrl = '';
    avatar.dataset.photoStudentName = '';
  }
  function finish() {
    if (settled) return;
    settled = true;
    if (typeof onSettled === 'function') onSettled();
  }
  image.onload = function() {
    if (avatar.dataset.photoRequest === requestKey) {
      avatar.classList.add('has-photo');
      avatar.dataset.photoFullUrl = viewerImageUrl;
      avatar.dataset.photoStudentName = String(studentName || 'Học sinh');
      avatar.setAttribute('aria-disabled', 'false');
      avatar.setAttribute('aria-label', 'Xem ảnh lớn của ' + String(studentName || 'học sinh'));
    }
    finish();
  };
  image.onerror = function() {
    if (avatar.dataset.photoRequest !== requestKey) {
      finish();
      return;
    }
    if (!proxyAttempted && proxyPayload.className && (proxyPayload.studentSTT || proxyPayload.studentName)) {
      proxyAttempted = true;
      google.script.run
        .withSuccessHandler(function(result) {
          if (avatar.dataset.photoRequest !== requestKey) { finish(); return; }
          const dataUrl = result && result.photoDataUrl ? String(result.photoDataUrl) : '';
          if (!/^data:image\//i.test(dataUrl)) { clearPhoto(); finish(); return; }
          profilePhotoProxyMode = true;
          viewerImageUrl = dataUrl;
          cacheProfilePhotoData(proxyCacheKey, dataUrl);
          image.src = dataUrl;
        })
        .withFailureHandler(function() {
          clearPhoto();
          finish();
        })
        .getStudentProfilePhotoData(proxyPayload);
      return;
    }
    clearPhoto();
    finish();
  };
  const cachedDataUrl = profilePhotoDataCache.get(proxyCacheKey);
  if (cachedDataUrl) {
    proxyAttempted = true;
    viewerImageUrl = cachedDataUrl;
    image.src = cachedDataUrl;
  } else {
    image.src = imageUrl;
  }
}

function renderStudentJumpList(query) {
  const container = document.getElementById('studentJumpList');
  const wanted = normalizeSubjectText(query);
  container.innerHTML = '';
  let shown = 0;

  students.forEach(function(student, index) {
    const searchable = normalizeSubjectText([
      student.STT || index + 1,
      student.HoVaTen || '',
      student.MSSV || ''
    ].join(' '));
    if (wanted && searchable.indexOf(wanted) === -1) return;

    shown++;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'student-jump-row' + (index === currentStudentIndex ? ' current' : '');
    button.dataset.studentJumpIndex = String(index);
    const attendance = getStudentJumpStatus(student);
    button.innerHTML =
      '<span class="student-jump-stt">' + escapeHtml(String(student.STT || index + 1).padStart(3, '0')) + '</span>' +
      '<span class="student-jump-name">' + escapeHtml(student.HoVaTen || 'Chưa có tên') + '</span>' +
      '<span class="student-jump-status ' + attendance.key + '" title="' + attendance.label + '" aria-label="' + attendance.label + '">' + attendance.symbol + '</span>';
    button.addEventListener('click', function() {
      closeStudentJumpList();
      showStudent(index);
    });
    container.appendChild(button);
  });

  if (!shown) container.innerHTML = '<div class="student-jump-empty">Không tìm thấy học sinh phù hợp.</div>';
  if (!wanted) {
    const current = container.querySelector('[data-student-jump-index="' + currentStudentIndex + '"]');
    if (current) requestAnimationFrame(function() { current.scrollIntoView({ block: 'center' }); });
  }
}

/** Chỉ sau khi HS hiện tại hoàn tất mới âm thầm chuẩn bị ảnh liền trước/liền sau. */
function scheduleAdjacentPhotoPreload(currentIndex) {
  if (currentIndex !== currentStudentIndex) return;
  const run = function() {
    if (currentIndex !== currentStudentIndex) return;
    [currentIndex - 1, currentIndex + 1].forEach(function(index) {
      if (index < 0 || index >= students.length) return;
      preloadStudentPhoto(students[index].LinkAnh);
    });
  };

  if ('requestIdleCallback' in window) {
    window.requestIdleCallback(run, { timeout: 800 });
  } else {
    setTimeout(run, 120);
  }
}

function preloadStudentPhoto(fullLink) {
  const imageUrl = getStudentPhotoUrl(fullLink);
  if (!imageUrl || adjacentPhotoCache.has(imageUrl)) return;

  const preloadImage = new Image();
  adjacentPhotoCache.set(imageUrl, preloadImage);
  preloadImage.onerror = function() {
    adjacentPhotoCache.delete(imageUrl);
  };
  preloadImage.src = imageUrl;

  // Chỉ giữ một vùng nhỏ quanh HS hiện tại, tránh chiếm bộ nhớ khi lớp đông.
  while (adjacentPhotoCache.size > MAX_PRELOADED_PHOTOS) {
    const oldestUrl = adjacentPhotoCache.keys().next().value;
    adjacentPhotoCache.delete(oldestUrl);
  }
}

function getProfilePhotoDataCacheKey(className, student) {
  return [
    String(className || ''),
    String(student && student.STT || ''),
    String(student && student.LinkAnh || '')
  ].join('|');
}

function cacheProfilePhotoData(key, dataUrl) {
  if (!key || !dataUrl) return;
  profilePhotoDataCache.set(key, dataUrl);
  while (profilePhotoDataCache.size > MAX_PROFILE_PHOTO_DATA_CACHE) {
    profilePhotoDataCache.delete(profilePhotoDataCache.keys().next().value);
  }
}

/**
 * Khi tài khoản bị Drive chặn, chuẩn bị riêng ảnh liền trước, liền sau và ảnh
 * thứ hai kế tiếp qua một lần gọi Code.gs. Không tải toàn bộ lớp.
 */
function scheduleProxyAdjacentPhotoPreload(currentIndex) {
  if (!profilePhotoProxyMode || currentIndex !== currentStudentIndex || !currentClassName) return;
  const className = currentClassName;
  const generation = profilePhotoPreloadGeneration;
  const refs = [];
  const pendingKeys = [];

  [currentIndex - 1, currentIndex + 1, currentIndex + 2].forEach(function(index) {
    if (index < 0 || index >= students.length) return;
    const student = students[index];
    if (!String(student.LinkAnh || '').trim()) return;
    const key = getProfilePhotoDataCacheKey(className, student);
    if (profilePhotoDataCache.has(key) || profilePhotoProxyPending.has(key)) return;
    profilePhotoProxyPending.add(key);
    pendingKeys.push(key);
    refs.push({ studentSTT: student.STT, studentName: student.HoVaTen });
  });
  if (!refs.length) return;

  const releasePending = function() {
    pendingKeys.forEach(function(key) { profilePhotoProxyPending.delete(key); });
  };
  const run = function() {
    if (generation !== profilePhotoPreloadGeneration || className !== currentClassName) {
      releasePending();
      return;
    }
    google.script.run
      .withSuccessHandler(function(result) {
        releasePending();
        if (generation !== profilePhotoPreloadGeneration || className !== currentClassName) return;
        const photos = result && Array.isArray(result.photos) ? result.photos : [];
        photos.forEach(function(photo) {
          const student = students.find(function(item) {
            const itemSTT = String(item.STT || '').trim();
            const photoSTT = String(photo.studentSTT || '').trim();
            return itemSTT === photoSTT ||
              (itemSTT && photoSTT && isFinite(Number(itemSTT)) &&
                isFinite(Number(photoSTT)) && Number(itemSTT) === Number(photoSTT));
          });
          if (!student || String(student.LinkAnh || '') !== String(photo.linkAnh || '')) return;
          const dataUrl = String(photo.photoDataUrl || '');
          if (/^data:image\//i.test(dataUrl)) {
            cacheProfilePhotoData(getProfilePhotoDataCacheKey(className, student), dataUrl);
          }
        });
      })
      .withFailureHandler(releasePending)
      .getStudentProfilePhotosData({ className: className, students: refs });
  };

  if ('requestIdleCallback' in window) {
    window.requestIdleCallback(run, { timeout: 500 });
  } else {
    setTimeout(run, 80);
  }
}
function getErrorMessage(error) {
  return error && error.message ? error.message : String(error || 'Lỗi không xác định');
}


/** Chuyển trang bằng thanh điều hướng cố định phía dưới. */
function setupBottomNavigation() {
  const navItems = Array.from(document.querySelectorAll('#bottomNav .navitem'));
  const pages = Array.from(document.querySelectorAll('.app-page'));

  function showPage(pageId) {
    pages.forEach(function(page) {
      const active = page.id === pageId;
      page.classList.toggle('active-page', active);
      page.setAttribute('aria-hidden', active ? 'false' : 'true');
    });

    navItems.forEach(function(item) {
      const active = item.dataset.page === pageId;
      item.classList.toggle('active', active);

      const ring = item.querySelector('.ring');
      if (active && !ring) {
        const dot = document.createElement('span');
        dot.className = 'ring';
        item.appendChild(dot);
      } else if (!active && ring) {
        ring.remove();
      }
    });

    // Mỗi lần bấm Cài đặt đều mở từ danh sách chức năng chính.
    if (pageId === 'pageSettings') showSettingsPanel('settingsMenuPanel');

    // Luôn đưa trang mới về đầu khi đổi mục.
    window.scrollTo(0, 0);
  }

  navItems.forEach(function(item) {
    item.addEventListener('click', function() {
      const pageId = item.dataset.page;
      if (!pageId) return;
      showPage(pageId);
    });
  });

  // Trạng thái ban đầu: Điểm danh.
  showPage('pageAttendance');
}

/** Ép giao diện về Điểm danh khi mở mới, quay lại hoặc mở lại tab WebApp. */
function forceAttendancePage() {
  const pages = Array.from(document.querySelectorAll('.app-page'));
  const navItems = Array.from(document.querySelectorAll('#bottomNav .navitem'));
  pages.forEach(function(page) {
    const active = page.id === 'pageAttendance';
    page.classList.toggle('active-page', active);
    page.setAttribute('aria-hidden', active ? 'false' : 'true');
  });
  navItems.forEach(function(item) {
    const active = item.dataset.page === 'pageAttendance';
    item.classList.toggle('active', active);
    const ring = item.querySelector('.ring');
    if (active && !ring) {
      const dot = document.createElement('span');
      dot.className = 'ring';
      item.appendChild(dot);
    } else if (!active && ring) {
      ring.remove();
    }
  });
  window.scrollTo(0, 0);
}

window.addEventListener('pageshow', forceAttendancePage);
