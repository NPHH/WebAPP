<script>
  // ============================================================
  // PHẦN 1
  // BIẾN - const / let
  // ============================================================

  const className = "26DL3A";

  let currentStudentIndex = 0;

  // ============================================================
  // PHẦN 2
  // ARRAY
  // ============================================================

  const studentNames = [
    "Nguyễn Văn An",

    "Trần Văn Bình",

    "Lê Văn Cường",

    "Phạm Văn Dũng",

    "Hoàng Văn Em",
  ];

  // ============================================================
  // PHẦN 3
  // OBJECT
  // ============================================================

  const exampleStudent = {
    stt: 1,

    hoTen: "Nguyễn Văn An",

    lop: "26DL3A",

    maSV: "26DL3A001",
  };

  // ============================================================
  // PHẦN 4
  // ARRAY OF OBJECTS
  // ============================================================

  const students = [
    {
      stt: 1,

      hoTen: "Nguyễn Văn An",

      lop: "26DL3A",

      maSV: "26DL3A001",
    },

    {
      stt: 2,

      hoTen: "Trần Văn Bình",

      lop: "26DL3A",

      maSV: "26DL3A002",
    },

    {
      stt: 3,

      hoTen: "Lê Văn Cường",

      lop: "26DL3A",

      maSV: "26DL3A003",
    },

    {
      stt: 4,

      hoTen: "Phạm Văn Dũng",

      lop: "26DL3A",

      maSV: "26DL3A004",
    },

    {
      stt: 5,

      hoTen: "Hoàng Văn Em",

      lop: "26DL3A",

      maSV: "26DL3A005",
    },
  ];

  // ============================================================
  // PHẦN 5
  // ARRAY PROPERTY
  // ============================================================

  console.log("Số học sinh:", students.length);

  // ============================================================
  // PHẦN 6
  // TRUY CẬP ARRAY
  // ============================================================

  console.log("Học sinh thứ nhất:", students[0]);

  console.log("Tên học sinh thứ nhất:", students[0].hoTen);

  console.log("Lớp học sinh thứ nhất:", students[0].lop);

  // ============================================================
  // PHẦN 7
  // DOM
  // ============================================================

  const studentSTT = document.getElementById("studentSTT");

  const studentName = document.getElementById("studentName");

  const studentClass = document.getElementById("studentClass");

  const studentId = document.getElementById("studentId");

  const studentCount = document.getElementById("studentCount");

  const currentIndex = document.getElementById("currentIndex");

  const btnPrevious = document.getElementById("btnPrevious");

  const btnNext = document.getElementById("btnNext");

  // ============================================================
  // PHẦN 8
  // FUNCTION HIỂN THỊ HỌC SINH
  // ============================================================

  function displayStudent() {
    // --------------------------------
    // Lấy Object học sinh hiện tại
    // --------------------------------

    const student = students[currentStudentIndex];

    // --------------------------------
    // Đưa dữ liệu vào HTML
    // --------------------------------

    studentSTT.textContent = "STT: " + student.stt;

    studentName.textContent = student.hoTen;

    studentClass.textContent = "Lớp: " + student.lop;

    studentId.textContent = "Mã SV: " + student.maSV;

    // --------------------------------
    // Hiển thị thông tin Array
    // --------------------------------

    studentCount.textContent = students.length;

    currentIndex.textContent = currentStudentIndex;

    // --------------------------------
    // Debug
    // --------------------------------

    console.log("Index:", currentStudentIndex);

    console.log("Student:", student);
  }

  // ============================================================
  // PHẦN 9
  // FOR CƠ BẢN
  // ============================================================

  for (let i = 0; i < students.length; i++) {
    console.log("FOR:", students[i].hoTen);
  }

  // ============================================================
  // PHẦN 10
  // FOR...OF
  // ============================================================

  for (const student of students) {
    console.log("FOR OF:", student.hoTen);
  }

  // ============================================================
  // PHẦN 11
  // EVENT - NÚT TIẾP
  // ============================================================

  btnNext.addEventListener("click", function () {
    if (currentStudentIndex < students.length - 1) {
      currentStudentIndex++;

      displayStudent();
    }
  });

  // ============================================================
  // PHẦN 12
  // EVENT - NÚT TRƯỚC
  // ============================================================

  btnPrevious.addEventListener("click", function () {
    if (currentStudentIndex > 0) {
      currentStudentIndex--;

      displayStudent();
    }
  });

  // ============================================================
  // PHẦN 13
  // KHỞI TẠO
  // ============================================================

  displayStudent();
</script>
