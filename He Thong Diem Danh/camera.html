<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Đăng ký khuôn mặt học sinh</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f2743">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    :root{--navy:#0f2743;--teal:#1f9d8b;--paper:#eef2f6;--muted:#b9c9d9;}
    *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#071727;color:#fff}
    body{display:flex;flex-direction:column;overflow:hidden}
    header{padding:max(14px,env(safe-area-inset-top)) 14px 10px;background:var(--navy)}
    h1{font-size:15px;margin:0 0 4px}.student{font-size:12px;color:var(--muted)}
    .camera{position:relative;flex:1;min-height:260px;background:#02080e;display:flex;align-items:center;justify-content:center;overflow:hidden}
    video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    video.rear-camera{transform:none}
    .guide{position:absolute;width:62%;max-width:270px;aspect-ratio:3/4;border:3px solid rgba(255,255,255,.85);border-radius:48% 48% 44% 44%;box-shadow:0 0 0 999px rgba(0,0,0,.26);pointer-events:none}
    .switch-camera{display:none;position:absolute;z-index:5;top:14px;right:14px;width:46px;height:46px;border-radius:50%;padding:0;background:rgba(15,39,67,.78);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:23px;line-height:46px}
    .switch-camera.show{display:block}
    footer{padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:#0c2035}
    .instruction{text-align:center;font-size:14px;font-weight:700;min-height:38px}
    .progress{display:flex;justify-content:center;gap:8px;margin:7px 0 12px}
    .dot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:10px}
    .dot.done{background:var(--teal)}
    .message{text-align:center;min-height:32px;font-size:11px;color:var(--muted);line-height:1.45}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
    .actions.camera-ready #startCamera{display:none}
    .actions:not(.camera-ready) #capture,.actions:not(.camera-ready) #finish{display:none}
    .actions.fallback-mode #startCamera,.actions.fallback-mode #capture{display:none}
    .actions.fallback-mode #fallbackCapture,.actions.fallback-mode #finish{display:block}
    button{border:0;border-radius:13px;padding:13px 8px;font-size:13px;font-weight:700}
    #startCamera{grid-column:1/-1;background:#fff;color:var(--navy)}
    #fallbackCapture{display:none;background:#fff;color:var(--navy)}
    #capture{background:#fff;color:var(--navy)} #finish{background:var(--teal);color:#fff} button:disabled{opacity:.42}
    canvas{display:none}
    .result-overlay{display:none;position:fixed;inset:0;z-index:100;background:#071727;padding:18px;align-items:center;justify-content:center}
    .result-overlay.show{display:flex}
    .result-card{width:min(520px,100%);background:#0f2743;border-radius:28px;padding:42px 24px;text-align:center}
    .result-icon{width:96px;height:96px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:var(--teal)}
    .result-title{font-size:32px;font-weight:800;margin-bottom:16px}
    .result-text{font-size:19px;font-weight:600;line-height:1.55;color:#eef5fb}
    .result-auto{font-size:15px;color:var(--muted);margin-top:14px}
    .result-close{width:100%;margin-top:24px;background:#fff;color:var(--navy)}
  </style>
</head>
<body>
  <header>
    <h1>Đăng ký khuôn mặt</h1>
    <div class="student" id="studentName">Đang chuẩn bị...</div>
  </header>
  <main class="camera">
    <video id="video" autoplay muted playsinline></video>
    <button id="switchCamera" class="switch-camera" type="button" aria-label="Đổi camera trước hoặc sau">↻</button>
    <div class="guide"></div>
    <canvas id="canvas"></canvas>
  </main>
  <footer>
    <div class="instruction" id="instruction">Đưa khuôn mặt vào giữa khung</div>
    <div class="progress" id="progress"></div>
    <div class="message" id="message">Đang nạp mô hình nhận diện...</div>
    <div class="actions" id="actions">
      <button id="startCamera" type="button" disabled>Đang mở camera...</button>
      <button id="fallbackCapture" type="button">Chụp bằng camera điện thoại</button>
      <button id="capture" type="button" disabled>Chụp mẫu</button>
      <button id="finish" type="button" disabled>Hoàn tất</button>
      <input id="fallbackInput" type="file" accept="image/*" capture="user" hidden>
    </div>
  </footer>
  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="result-icon">✓</div>
      <div class="result-title" id="resultTitle">Đã gửi dữ liệu</div>
      <div class="result-text" id="resultText">Đã lưu ảnh và 5 mẫu khuôn mặt.</div>
      <div class="result-auto">Thẻ camera sẽ tự đóng trong giây lát…</div>
      <button class="result-close" id="resultClose" type="button">Đóng và quay lại WebApp</button>
    </div>
  </div>

  <script>
    /*
     * Trang này chỉ chạy camera và tạo vector ngay trên điện thoại.
     * Không có Google Sheets, Drive hay thông tin hồ sơ học sinh tại đây.
     */
    const MODEL_URL='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
    const params=new URLSearchParams(location.search);
    const token=params.get('token')||'';
    const submitUrl=params.get('submitUrl')||'';
    const studentName=params.get('studentName')||'Học sinh';
    const LOCAL_DB_NAME='attendance-face-pwa';
    const LOCAL_DB_VERSION=1;
    const LOCAL_STORE='registrations';
    const instructions=[
      'Mẫu 1/5 · Nhìn thẳng vào camera',
      'Mẫu 2/5 · Quay nhẹ sang trái',
      'Mẫu 3/5 · Quay nhẹ sang phải',
      'Mẫu 4/5 · Hơi ngẩng mặt',
      'Mẫu 5/5 · Hơi cúi mặt'
    ];
    let stream=null,vectors=[],portraitDataUrl='',busy=false,modelsReady=false,uploadBusy=false;
    let currentFacing='user';
    let modelsPromise=null;
    const $=id=>document.getElementById(id);
    $('studentName').textContent=studentName;

    function setMessage(text){$('message').textContent=text}

    /** Mở kho dữ liệu cục bộ của riêng PWA trên thiết bị này. */
    function openLocalDb(){
      return new Promise((resolve,reject)=>{
        const request=indexedDB.open(LOCAL_DB_NAME,LOCAL_DB_VERSION);
        request.onupgradeneeded=()=>{
          const db=request.result;
          if(!db.objectStoreNames.contains(LOCAL_STORE))db.createObjectStore(LOCAL_STORE,{keyPath:'token'});
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error('Không mở được bộ nhớ cục bộ.'));
      });
    }

    async function saveLocalJob(job){
      const db=await openLocalDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(LOCAL_STORE,'readwrite');
        tx.objectStore(LOCAL_STORE).put(job);
        tx.oncomplete=()=>{db.close();resolve()};
        tx.onerror=()=>{db.close();reject(tx.error)};
      });
    }

    async function getLocalJobs(){
      const db=await openLocalDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(LOCAL_STORE,'readonly');
        const request=tx.objectStore(LOCAL_STORE).getAll();
        request.onsuccess=()=>resolve(request.result||[]);
        request.onerror=()=>reject(request.error);
        tx.oncomplete=()=>db.close();
      });
    }

    async function deleteLocalJob(jobToken){
      const db=await openLocalDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(LOCAL_STORE,'readwrite');
        tx.objectStore(LOCAL_STORE).delete(jobToken);
        tx.oncomplete=()=>{db.close();resolve()};
        tx.onerror=()=>{db.close();reject(tx.error)};
      });
    }

    function jobToFormData(job){
      const data=new FormData();
      data.append('action','faceRegistrationUpload');
      data.append('token',job.token);
      data.append('vectors',JSON.stringify(job.vectors));
      data.append('portraitDataUrl',job.portraitDataUrl);
      return data;
    }

    /** Gửi một công việc nền; bản cục bộ vẫn giữ lại cho đến khi xác nhận. */
    function submitLocalJob(job){
      let accepted=false;
      try{if(navigator.sendBeacon)accepted=navigator.sendBeacon(job.submitUrl,jobToFormData(job))}catch(ignored){}
      if(!accepted){
        try{
          fetch(job.submitUrl,{method:'POST',body:jobToFormData(job),mode:'no-cors',keepalive:true}).catch(()=>{});
          accepted=true;
        }catch(ignored){}
      }
      return accepted;
    }

    /** Kiểm tra những bản cũ và gửi lại khi PWA được mở lần sau. */
    async function syncPendingJobs(){
      try{
        const jobs=await getLocalJobs();
        jobs.forEach(job=>{
          // Sau 6 giờ, nếu yêu cầu đã từng gửi thì Google thường đã xử lý xong;
          // xóa bản hàng đợi cũ để tránh gửi mã phiên hết hạn mãi mãi.
          if(job.lastSubmittedAt&&Date.now()-job.lastSubmittedAt>21600000){deleteLocalJob(job.token).catch(()=>{});return}
          job.lastSubmittedAt=Date.now();
          saveLocalJob(job).then(()=>submitLocalJob(job)).catch(()=>{});
        });
      }catch(ignored){}
    }

    function preparePwa(){
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
      }
      syncPendingJobs();
    }
    function enableFallback(message){
      stop();
      $('actions').classList.remove('camera-ready');
      $('actions').classList.add('fallback-mode');
      $('instruction').textContent='Dùng camera điện thoại để chụp từng mẫu';
      setMessage(message||'Trình duyệt không mở được camera trực tuyến. Hãy chụp lần lượt 5 ảnh.');
      $('fallbackCapture').disabled=false;
    }
    function renderProgress(){
      $('progress').innerHTML='';
      for(let i=0;i<5;i++){
        const dot=document.createElement('span');
        dot.className='dot'+(i<vectors.length?' done':'');
        dot.textContent=i<vectors.length?'✓':String(i+1);
        $('progress').appendChild(dot);
      }
    }

    /**
     * Nạp mô hình nhận diện song song, nhưng KHÔNG xin quyền camera ở đây.
     * Safari iPhone yêu cầu việc mở camera phải bắt đầu trực tiếp từ lần chạm
     * của người dùng. Vì vậy getUserMedia() chỉ được gọi trong openCamera().
     */
    function loadModels(){
      if(modelsPromise)return modelsPromise;
      modelsPromise=Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]).then(()=>{modelsReady=true;return true});
      return modelsPromise;
    }

    async function preparePage(){
      if(!token||!submitUrl){
        throw new Error('Trang camera phải được mở từ WebApp điểm danh.');
      }
      if(typeof faceapi==='undefined') throw new Error('Không tải được thư viện nhận diện.');
      // Bắt đầu nạp mô hình ngay để giảm thời gian chờ sau khi camera mở.
      loadModels().catch(error=>setMessage('Không tải được mô hình nhận diện: '+(error.message||error)));
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        enableFallback('Trình duyệt này không hỗ trợ camera trực tuyến. Hãy dùng camera điện thoại để chụp 5 mẫu.');
        return;
      }
      // Tự mở ngay khi trang sẵn sàng. Nếu trình duyệt chặn, openCamera() sẽ
      // tự chuyển sang chế độ chụp bằng camera hệ thống.
      $('instruction').textContent='Đang mở camera...';
      setMessage('Nếu điện thoại hỏi quyền camera, hãy chọn Cho phép.');
      await openCamera();
    }

    /**
     * Mở camera từ chính sự kiện chạm nút. Chỉ mở một lần và giữ nguyên luồng
     * trong suốt 5 mẫu; tuyệt đối không dừng/mở lại sau mỗi lần chụp.
     */
    async function openCamera(){
      if(busy||stream)return;
      busy=true;
      $('startCamera').disabled=true;
      setMessage('Đang mở camera trước...');
      try{
        try{
          stream=await navigator.mediaDevices.getUserMedia({
            video:{facingMode:{ideal:currentFacing},width:{ideal:720},height:{ideal:960}},
            audio:false
          });
        }catch(firstError){
          // Một số trình duyệt Android cũ không hiểu facingMode/kích thước ideal.
          // Chỉ thử cấu hình đơn giản khi lỗi do ràng buộc hoặc không tìm thấy camera;
          // không lặp lại nếu người dùng đã từ chối quyền.
          const retryable=['OverconstrainedError','ConstraintNotSatisfiedError','NotFoundError'];
          if(retryable.indexOf(String(firstError&&firstError.name||''))===-1)throw firstError;
          stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        }
        const video=$('video');
        video.classList.toggle('rear-camera',currentFacing==='environment');
        video.setAttribute('playsinline','');
        video.muted=true;
        video.srcObject=stream;
        await new Promise((resolve,reject)=>{
          if(video.readyState>=2&&video.videoWidth)return resolve();
          const timer=setTimeout(()=>reject(new Error('Camera mở quá lâu. Hãy thử lại.')),10000);
          video.onloadedmetadata=()=>{clearTimeout(timer);resolve()};
        });
        await video.play();
        $('switchCamera').classList.add('show');
        $('actions').classList.add('camera-ready');
        $('instruction').textContent=instructions[0];
        setMessage(modelsReady?'Đưa một khuôn mặt vào giữa khung rồi bấm Chụp mẫu.':'Camera đã mở. Đang nạp mô hình nhận diện...');
        await loadModels();
        await new Promise(resolve=>setTimeout(resolve,180));
        setMessage('Đưa một khuôn mặt vào giữa khung rồi bấm Chụp mẫu.');
        $('capture').disabled=false;
      }catch(error){
        const name=String(error&&error.name||'');
        if(name==='NotAllowedError'||name==='SecurityError'){
          enableFallback('Trình duyệt đang chặn camera trực tuyến. Có thể tiếp tục bằng camera điện thoại.');
        }else{
          enableFallback((error.message||String(error))+' Có thể tiếp tục bằng camera điện thoại.');
        }
      }finally{busy=false}
    }

    /** Đổi giữa camera trước và camera sau mà không làm mất các mẫu đã chụp. */
    async function switchCamera(){
      if(busy||uploadBusy)return;
      currentFacing=currentFacing==='user'?'environment':'user';
      $('switchCamera').disabled=true;
      stop();
      setMessage('Đang chuyển sang camera '+(currentFacing==='user'?'trước':'sau')+'...');
      await openCamera();
      $('switchCamera').disabled=false;
    }

    /**
     * Đường dự phòng cho trình duyệt cũ hoặc trình duyệt tích hợp: mở ứng dụng
     * camera của điện thoại bằng input capture, sau đó nhận diện trên ảnh vừa chụp.
     */
    function openFallbackCamera(){
      if(busy||vectors.length>=5)return;
      $('fallbackInput').value='';
      $('fallbackInput').click();
    }

    async function processFallbackPhoto(file){
      if(!file||busy||vectors.length>=5)return;
      busy=true;$('fallbackCapture').disabled=true;
      setMessage('Đang kiểm tra ảnh mẫu '+(vectors.length+1)+'...');
      let objectUrl='';
      try{
        await loadModels();
        objectUrl=URL.createObjectURL(file);
        const image=new Image();
        await new Promise((resolve,reject)=>{
          image.onload=resolve;
          image.onerror=()=>reject(new Error('Không đọc được ảnh vừa chụp.'));
          image.src=objectUrl;
        });
        const canvas=$('canvas');
        const scale=Math.min(1,640/image.naturalWidth);
        canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
        canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
        const detections=await faceapi.detectAllFaces(canvas,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.45})).withFaceLandmarks().withFaceDescriptors();
        if(!detections.length)throw new Error('Không thấy khuôn mặt. Hãy chụp lại nơi đủ sáng.');
        if(detections.length>1)throw new Error('Ảnh có nhiều khuôn mặt. Chỉ chụp một học sinh.');
        const box=detections[0].detection.box;
        if(box.width<canvas.width*.22||box.height<canvas.height*.22)throw new Error('Khuôn mặt quá xa. Hãy chụp gần hơn.');
        vectors.push(Array.from(detections[0].descriptor).map(v=>Number(v.toFixed(7))));
        if(vectors.length===1)portraitDataUrl=createPortraitDataUrl(canvas,box);
        renderProgress();
        if(vectors.length<5){
          $('instruction').textContent=instructions[vectors.length];
          setMessage('Đã chụp '+vectors.length+'/5 mẫu. Bấm nút để chụp tư thế tiếp theo.');
        }else{
          $('instruction').textContent='Đã đủ 5 mẫu khuôn mặt';
          setMessage('Bấm Hoàn tất để lưu dữ liệu.');
          $('fallbackCapture').disabled=true;
          $('finish').disabled=false;
        }
      }catch(error){
        setMessage('Chưa chụp được mẫu '+(vectors.length+1)+': '+(error.message||String(error)));
      }finally{
        if(objectUrl)URL.revokeObjectURL(objectUrl);
        busy=false;
        if(vectors.length<5)$('fallbackCapture').disabled=false;
      }
    }

    async function capture(){
      if(busy||vectors.length>=5)return;
      busy=true;$('capture').disabled=true;setMessage('Đang kiểm tra khuôn mặt...');
      try{
        const video=$('video'),canvas=$('canvas');
        const videoTrack=stream&&stream.getVideoTracks?stream.getVideoTracks()[0]:null;
        if(!videoTrack||videoTrack.readyState!=='live'||!video.videoWidth){
          throw new Error('Camera chưa sẵn sàng. Hãy bấm Mở camera lại.');
        }
        const scale=Math.min(1,640/video.videoWidth);
        canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
        canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
        const detections=await faceapi.detectAllFaces(canvas,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.45})).withFaceLandmarks().withFaceDescriptors();
        if(!detections.length)throw new Error('Không thấy khuôn mặt. Hãy nhìn vào camera và tăng ánh sáng.');
        if(detections.length>1)throw new Error('Có nhiều khuôn mặt. Chỉ để một học sinh trước camera.');
        const box=detections[0].detection.box;
        if(box.width<canvas.width*.22||box.height<canvas.height*.22)throw new Error('Khuôn mặt quá xa. Hãy đưa điện thoại lại gần hơn.');
        vectors.push(Array.from(detections[0].descriptor).map(v=>Number(v.toFixed(7))));
        if(vectors.length===1)portraitDataUrl=createPortraitDataUrl(canvas,box);
        renderProgress();
        if(vectors.length<5){
          $('instruction').textContent=instructions[vectors.length];
          setMessage('Đã chụp '+vectors.length+'/5 mẫu. Chuẩn bị tư thế tiếp theo.');
        }else{
          $('instruction').textContent='Đã đủ 5 mẫu khuôn mặt';
          setMessage('Bấm Hoàn tất để gửi dữ liệu về WebApp.');
          $('finish').disabled=false;
        }
      }catch(error){
        // Lỗi của một mẫu không được đổi thành lỗi mở camera và không dừng luồng.
        setMessage('Chưa chụp được mẫu '+(vectors.length+1)+': '+(error.message||String(error)));
      }
      finally{busy=false;$('capture').disabled=vectors.length>=5}
    }

    /**
     * Chỉ lưu ảnh chân dung đã cắt quanh khuôn mặt thay vì cả khung camera.
     * Ảnh nhẹ hơn nhiều, gửi nhanh hơn và vẫn đủ rõ để giáo viên nhận diện.
     */
    function createPortraitDataUrl(sourceCanvas,box){
      const padX=box.width*.48,padTop=box.height*.55,padBottom=box.height*.38;
      const sx=Math.max(0,Math.floor(box.x-padX));
      const sy=Math.max(0,Math.floor(box.y-padTop));
      const right=Math.min(sourceCanvas.width,Math.ceil(box.x+box.width+padX));
      const bottom=Math.min(sourceCanvas.height,Math.ceil(box.y+box.height+padBottom));
      const sw=Math.max(1,right-sx),sh=Math.max(1,bottom-sy);
      const portrait=document.createElement('canvas');
      portrait.width=Math.min(300,sw);
      portrait.height=Math.max(1,Math.round(sh*(portrait.width/sw)));
      portrait.getContext('2d').drawImage(sourceCanvas,sx,sy,sw,sh,0,0,portrait.width,portrait.height);
      return portrait.toDataURL('image/jpeg',.68);
    }

    /**
     * Gửi nền bằng sendBeacon để tác vụ tiếp tục ngay cả khi thẻ camera đóng.
     * WebApp chính sẽ kiểm tra trạng thái lưu qua google.script.run.
     */
    async function finish(){
      if(vectors.length!==5||!portraitDataUrl||uploadBusy)return;
      uploadBusy=true;
      $('finish').disabled=true;
      $('capture').disabled=true;
      setMessage('Đang lưu trên điện thoại...');
      const job={
        token:token,
        submitUrl:submitUrl,
        studentName:studentName,
        vectors:vectors,
        portraitDataUrl:portraitDataUrl,
        createdAt:Date.now(),
        lastSubmittedAt:0
      };
      try{
        await saveLocalJob(job);
      }catch(error){
        uploadBusy=false;
        $('finish').disabled=false;
        setMessage('Không lưu được trên điện thoại: '+(error.message||String(error)));
        return;
      }
      job.lastSubmittedAt=Date.now();
      saveLocalJob(job).catch(()=>{});
      const submitted=submitLocalJob(job);
      if(!submitted&&navigator.serviceWorker&&navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(registration=>{
          if(registration.sync&&registration.sync.register){
            registration.sync.register('sync-face-registrations').catch(()=>{});
          }
        }).catch(()=>{});
      }
      showLocalSaved();
    }

    function closeCameraTab(){
      try{if(window.opener)window.opener.focus()}catch(ignored){}
      window.close();
    }

    function showLocalSaved(){
      stop();
      $('resultTitle').textContent='Đã lưu trên điện thoại';
      $('resultText').textContent='Có thể tiếp tục làm việc. Dữ liệu sẽ tự đồng bộ với Google.';
      $('resultOverlay').classList.add('show');
      try{if(window.opener)window.opener.postMessage({type:'FACE_REGISTRATION_LOCAL_SAVED',token,studentName},'*')}catch(ignored){}
      setTimeout(closeCameraTab,1200);
    }

    function stop(){
      if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}
      const video=$('video');
      if(video)video.srcObject=null;
      $('switchCamera').classList.remove('show');
    }
    $('startCamera').addEventListener('click',openCamera);
    $('switchCamera').addEventListener('click',switchCamera);
    $('fallbackCapture').addEventListener('click',openFallbackCamera);
    $('fallbackInput').addEventListener('change',event=>processFallbackPhoto(event.target.files&&event.target.files[0]));
    $('resultClose').addEventListener('click',closeCameraTab);
    $('capture').addEventListener('click',capture);$('finish').addEventListener('click',finish);
    window.addEventListener('beforeunload',stop);renderProgress();preparePwa();
    preparePage().catch(error=>{setMessage(error.message||String(error));$('instruction').textContent='Không thể chuẩn bị trang camera';$('startCamera').disabled=true;});
  </script>
</body>
</html>
